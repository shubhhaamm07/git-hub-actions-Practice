# ensure the docker files and docker images are security tested
name: Docker Scan
on:
  workflow_call:
jobs:
  docker-file-linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: ["backend", "frontend"]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Docker-file lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{matrix.folders}}/Dockerfile
      - name: Login as Docker
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker Build ${{matrix.folders}}
        run: Docker build -t ${{vars.DOCKER_USERNAME}}/devboard-${{matrix.folders}}:latest .
        working-directory: ${{matrix.folders}}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{vars.DOCKER_USERNAME}}/devboard-${{matrix.folders}}:latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
