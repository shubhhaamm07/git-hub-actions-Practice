# I have to sast for my code
name: Code-Qualtiy

on:
  workflow_call: # can use this workflow before or after any workflow
jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Code-Checkout
        uses: actions/checkout@v7
      - name: Setup of Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm install
      - name: Run Linter
        run: npm run lint
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install Dependencies
        run: go mod download
      - name: Go formatter
        run: go fmt
      - name: Go Vet
        run: go vet
