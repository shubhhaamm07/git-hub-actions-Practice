name: CICD
on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build using Docker
        run: echo "Building using Docker"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: running test cases
        run: echo "Testing the app"
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the code
        run: echo "Deploying the code"
