name: AutoLinter
on:
  push:
    paths:
      - '**/*.py'

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linter
        run: pip install ruff
      - name: Check the file for linting
        run: ruff check .
