name: AutoLinter
on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    #this step will auto matically clone tyhe code of the current branch into the runner
    steps:
      - name: Checkout the Code
        uses: actions/checkout@v7
      - name: Install Linter
        run: pip install ruff
      - name: Check the file for linting
        run: ruff check .
