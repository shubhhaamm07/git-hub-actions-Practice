name: DevSecOps

on:
  push:
    branches: [main]

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml
  secreat-scanning:
    uses: ./.github/workflows/secreat-scanning.yml
  dependency-scanning:
    uses: ./.github/workflows/dependency-scan.yml
  docker-checks:
    uses: ./.github/workflows/docker-scans.yml
    secrets: inherit
  sonar:
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit
  push-to-docker-hub:
    uses: ./.github/workflows/ci.yml
