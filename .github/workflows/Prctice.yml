name: Docker Practice
on:
  push:
    branches: ["main"]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run test
        run: npm run test

      - name: Login as Docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKER_USERNAME}}/devboard-frontend:latest

  #  Code shift ✅
  #  Node setup ✅
  #  install dependencies ✅
  #  linter ✅
  #  test ✅
  #  docker is maily beacuse we have to push the images to docker hub and then deploy it to kubernetes cluster
  # backend ✅
  # Go setup
  # dependencies install
  # linter
  # test
  # build
  # push to docker hub
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup of Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go Formatter
        run: go fmt
      - name: Run Go Vet
        run: go vet
      - name: Run Linter
        run: go test

      - name: Login as Docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ vars.DOCKER_USERNAME}}/devboard-backend:latest
