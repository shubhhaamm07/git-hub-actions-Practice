name: Docker Practice
on:
  push:
    branches: ["main"] 
jobs:
    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                    node-version: 20
                    cache: 'npm'
                    cache-dependency-path: frontend/package-lock.json
            
            - name: Install Dependencies
              run: npm install 

            - name: Run linter
              run: npm run lint

            - name: Run test
              run: npm run test

            - name: Login as Docker
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_TOKEN }}

            - name: Docker build and push
              run:
                docker build -t ${{ vars.DOCKER_USERNAME }}/frontend:latest .
                docker push ${{ vars.DOCKER_USERNAME }}/frontend:latestd

          
              



#  Code shift ✅
#  Node setup ✅
#  install dependencies ✅
#  linter ✅
#  test 
#  docker is maily beacuse we have to push the images to docker hub and then deploy it to kubernetes cluster
