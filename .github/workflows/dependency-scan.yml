# To ensure package and dependency have been audited for security
name: Dependency

on:
  workflow_call:
jobs:
  dependency-call:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          go-version: 1.26
          cache-dependency-path: backend/go.sum

      - name: Install Govulcheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: GOvul check
        continue-on-error: true
        run: govulncheck ./... > go-vulcheck-report.txt
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependency Scan
        run: npm audit
        working-directory: frontend
      - name: Upload job to Artifets
        uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: reports/go-vulcheck-report.txt
          retention-days: 5
