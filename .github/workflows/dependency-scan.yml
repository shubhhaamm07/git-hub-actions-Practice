name: Dependency

on:
  workflow_call:

jobs:
  go-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan Go dependencies
        id: govulncheck
        shell: bash
        working-directory: backend
        run: govulncheck ./... 2>&1 | tee go-vulcheck-report.txt

      - name: Upload Go vulnerability report
        if: ${{ always() && steps.govulncheck.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: go-vulncheck-report
          path: backend/go-vulcheck-report.txt
          if-no-files-found: error
          retention-days: 5

  frontend-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit
