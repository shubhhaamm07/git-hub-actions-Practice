# #Gole - I have to lint build test the code for frontend and backend and then push the Images to docker hub

# Checkout code ✅
# Install Dependencies
# Lint
# test
# build
name: CI
on:
  # push:
  #   # paths:
  #   #   - "**"
  #   #   - "!.github/workflows/**"
  #   branches: [main]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Test
        run: npm run test
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Go tests
        run: go test
  build-and-push-images:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [frontend, backend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Login as Docker
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v2
        with:
          context: ./${{ matrix.folder }}
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/devboard-${{ matrix.folder }}:latest

  deploy:
    needs: [frontend, backend, build-and-push-images]
    uses: ./.github/workflows/cd.yml
    secrets: inherit
