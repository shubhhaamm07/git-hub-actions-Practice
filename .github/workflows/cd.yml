# Goal: to deploy build images from CI step once the CI workflow is succeeded
name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Copy .env file to main env file
        run: cp .env.example .env
      - name: Login as Docker
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Deploy the container with docker-compose
        run: |
          docker compose pull
          docker compose up -d
